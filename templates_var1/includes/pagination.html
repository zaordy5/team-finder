{% if is_paginated %}
    <div class="pagination" style="display: flex; gap: 8px; justify-content: center; margin: 32px 0; flex-wrap: wrap;">
        {% if page_obj.has_previous %}
            <a class="white-button" href="?page={{ page_obj.previous_page_number }}{{ query_without_page }}">
                ← Назад
            </a>
        {% endif %}

        <span class="project-subtitle" style="margin: 0; align-self: center;">
            Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}
        </span>

        {% if page_obj.has_next %}
            <a class="white-button" href="?page={{ page_obj.next_page_number }}{{ query_without_page }}">
                Вперёд →
            </a>
        {% endif %}
    </div>
{% endif %}
