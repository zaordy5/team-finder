{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}TeamFinder{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body data-page="{% block page_id %}default{% endblock %}">
{% include 'includes/header.html' %}
{% if messages %}
<div class="messages-container" style="max-width:1200px;margin:24px auto 0;padding:0 16px;">
    {% for message in messages %}
    <div class="message message-{{ message.tags|default:'info' }}" style="padding:12px 16px;border-radius:14px;margin-bottom:12px;background:#f4f5f7;border:1px solid #d9dde3;">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
{% block content %}{% endblock %}
<script src="{% static 'js/utils.js' %}"></script>
<script src="{% static 'js/share.js' %}"></script>
<script src="{% static 'js/header.js' %}"></script>
<script src="{% static 'js/skills.js' %}"></script>
<script src="{% static 'js/projects.js' %}"></script>
</body>
</html>
